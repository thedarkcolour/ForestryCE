var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
	var replaceProperties = [
			'version'              : project.version,
			'forgeVersionRange'    : forgeVersionRange,
			'jeiVersionRange'      : jeiVersionRange,
			'patchouliVersionRange': patchouliVersionRange,
			'fmlVersionRange'      : fmlVersionRange,
	]
	inputs.properties replaceProperties
	expand replaceProperties

	from 'src/main/templates'
	into 'build/generated/sources/modMetadata'
}

// One neoforge.mods.toml per content jar, expanded from the same properties as core's
var contentModMetadata = contentModules.collectEntries { m ->
	[(m): tasks.register("generateModMetadata${m.capitalize()}", ProcessResources) {
		var replaceProperties = [
				'version'          : project.version,
				'forgeVersionRange': forgeVersionRange,
				'fmlVersionRange'  : fmlVersionRange,
		]
		inputs.properties replaceProperties
		expand replaceProperties

		from "src/${m}/templates"
		into "build/generated/sources/modMetadata${m.capitalize()}"
	}]
}

var gametestModMetadata = tasks.register('generateModMetadataGametest', ProcessResources) {
	var replaceProperties = ['version': project.version, 'fmlVersionRange': fmlVersionRange]
	inputs.properties replaceProperties
	expand replaceProperties
	from 'src/test/templates'
	into 'build/generated/sources/modMetadataGametest'
}
sourceSets.test.resources.srcDir gametestModMetadata
// AlleleTranslationKeyTest reads en_us.json off its own classloader, and since the suite became its
// own mod id it no longer shares one with core. Give the gametest mod the merged lang directly; it
// is dev-only and never published, so the duplicate costs nothing
sourceSets.test.resources.srcDir 'build/generated/sources/mergedAssets'
tasks.named('processTestResources') { dependsOn(generateEnUsLang) }
neoForge.ideSyncTask gametestModMetadata

contentModules.each { m ->
	sourceSets[m].resources.srcDir "src/generated/resources_${m}"
	sourceSets[m].resources.srcDir contentModMetadata[m]
	neoForge.ideSyncTask contentModMetadata[m]
}

// Helper function to extract JSON entries while preserving duplicate keys
static def extractJsonEntries(File jsonFile) {
	def entries = []
	def lines = jsonFile.readLines()
	def slurper = new JsonSlurper()

	lines.each { line ->
		// Match lines like: "key": "value" or "key": value
		def matcher = line =~ /^\s*"([^"]+)"\s*:\s*(.+?)\s*,?\s*$/
		if (matcher.find()) {
			def key = matcher.group(1)
			def valueStr = matcher.group(2)

			// Remove trailing comma if present
			if (valueStr.endsWith(',')) {
				valueStr = valueStr.substring(0, valueStr.length() - 1).trim()
			}

			// Parse the value properly
			def value
			try {
				value = slurper.parseText(valueStr)
			} catch (Exception e) {
				// If parsing fails, keep as string (shouldn't happen for valid JSON)
				value = valueStr.replaceAll('^"|"$', '')
			}

			entries.add([key: key, value: value])
		}
	}

	return entries
}

// merge generated JSON into main JSON
var generateEnUsLang = tasks.register('generateEnUsLang', DefaultTask) {
	var manualFile = project.file('src/main/resources/assets/forestry/lang/en_us.json')
	var generatedFile = project.file('src/generated/resources/assets/forestry/lang/en_us.json')
	var mergedFile = project.file('build/generated/sources/mergedAssets/assets/forestry/lang/en_us.json')

	inputs.file(manualFile)
	inputs.file(generatedFile).skipWhenEmpty(true)
	outputs.file(mergedFile)

	doLast {
		mergedFile.parentFile.mkdirs()

		if (manualFile.exists() && generatedFile.exists()) {
			// Read main file and extract all entries (including duplicate _comment fields)
			def mainEntries = extractJsonEntries(manualFile)
			def generatedEntries = extractJsonEntries(generatedFile)

			// Track which non-comment keys we've already seen
			def seenKeys = new HashSet()
			mainEntries.each { entry ->
				if (entry.key != "_comment") {
					seenKeys.add(entry.key)
				}
			}

			// Filter generated entries to only include new keys (but keep all _comment fields)
			def filteredGeneratedEntries = generatedEntries.findAll { entry ->
				entry.key == "_comment" || !seenKeys.contains(entry.key)
			}

			// Combine: main entries first, then new generated entries
			def allEntries = mainEntries + filteredGeneratedEntries

			// Write JSON using JsonOutput for proper formatting
			def lines = allEntries.collect { entry ->
				"  ${JsonOutput.toJson(entry.key)}: ${JsonOutput.toJson(entry.value)}"
			}

			mergedFile.text = "{\n${lines.join(',\n')}\n}"
		} else if (manualFile.exists()) {
			copy {
				from manualFile
				into mergedFile.parentFile
			}
		} else if (generatedFile.exists()) {
			copy {
				from generatedFile
				into mergedFile.parentFile
			}
		}
	}
}

tasks.named('processResources', ProcessResources) {
	dependsOn(generateEnUsLang)

	// Three of core's source roots hold an assets/forestry/lang/en_us.json: the hand-written one,
	// core's generated one, and the merge of the two. Only the merge belongs in the jar, and an
	// exclude at the top of a Copy task applies to every source it has, so the two originals are told
	// apart from the merge by where they came from
	var mergedRoot = project.file('build/generated/sources/mergedAssets').absolutePath + File.separator
	exclude { details ->
		return !details.directory
				&& details.relativePath.pathString == 'assets/forestry/lang/en_us.json'
				&& !details.file.absolutePath.startsWith(mergedRoot)
	}

	exclude 'assets/forestry/lang/check_translations.py'
}

sourceSets.main {
	resources {
		srcDir 'src/generated/resources'
		srcDir 'build/generated/sources/mergedAssets'
		srcDir generateModMetadata
	}
}

neoForge.ideSyncTask generateModMetadata

// Datagen providers reference ModKit, which is not shipped. FML's annotation scanner resolves method
// signatures at boot via getDeclaredMethods0, and a lambda method reference in an @EventBusSubscriber
// class carries ModKit types in its synthetic descriptor. See c540144fc. Shared so every jar task
// applies the same rule; a jar task that forgets to call this would ship ModKit
var excludeDatagen = { Jar task ->
	task.exclude 'forestry/**/data/**'
	task.exclude 'META-INF/services/forestry.core.data.IForestryDataProvider'
}

jar {
	excludeDatagen(delegate)

	manifest {
		attributes([
				'Specification-Title'     : 'Forestry',
				'Specification-Vendor'    : 'SirSengir',
				'Specification-Version'   : "${project.version}",
				'Implementation-Title'    : "${project.name}",
				'Implementation-Version'  : "${project.version}",
				'Implementation-Vendor'   : 'SirSengir',
				'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
		])
	}
}

var contentJars = contentModules.collectEntries { m ->
	[(m): tasks.register("${m}Jar", Jar) {
		group = 'build'
		description = "Assembles the forestry${m} jar"
		archiveBaseName.set("forestry${m}-${minecraftVersion}")

		// the module's classes plus the resources of its own source set, which is the whole partition
		from sourceSets[m].output

		excludeDatagen(delegate)

		manifest {
			attributes([
					'Specification-Title'     : "Forestry: ${m.capitalize()}",
					'Specification-Vendor'    : 'SirSengir',
					'Specification-Version'   : "${project.version}",
					'Implementation-Title'    : "forestry${m}",
					'Implementation-Version'  : "${project.version}",
					'Implementation-Vendor'   : 'SirSengir',
					'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
			])
		}
	}]
}

// A boot configuration proves what loads. It cannot prove what shipped: base once went out with no
// en_us and no global_loot_modifiers.json and every boot still reached Done, because a missing loot
// modifier list is not an error and a headless server never renders a lang key. This reads the built
// jars instead, and it is the cheaper of the two checks.
var checkJarPartition = tasks.register('checkJarPartition') {
	group = 'verification'
	description = 'Fails if a jar carries another jar\'s classes, references ModKit, strands a .mcmeta or misplaces en_us'

	dependsOn tasks.named('jar')
	contentModules.each { dependsOn contentJars[it] }
	outputs.upToDateWhen { false }

	doLast {
		var problems = new ArrayList<String>()
		var jarFiles = ['core': tasks.named('jar').get().archiveFile.get().asFile]
		contentModules.each { m -> jarFiles[m] = contentJars[m].get().archiveFile.get().asFile }

		var langPath = 'assets/forestry/lang/en_us.json'
		var langBytes = new HashMap<String, byte[]>()

		// A source set boundary used to keep ModKit off the production compile classpath. The datagen
		// providers live in the production source sets now, so the artifact is what has to prove it.
		// The literal below is ModKit's java package, not its maven coordinate, so re-pinning the sha
		// leaves it correct. A package rename is what would silently stop the check firing
		var entries = jarFiles.collectEntries { jarName, file ->
			var names = new HashSet<String>()
			new java.util.zip.ZipFile(file).withCloseable { zip ->
				zip.entries().each { entry ->
					names.add(entry.name)
					if (entry.name.endsWith('.class')) {
						var text = new String(zip.getInputStream(entry).bytes, 'ISO-8859-1')
						if (text.contains('thedarkcolour/modkit') || text.contains('thedarkcolour.modkit')) {
							problems.add("${jarName} jar: ${entry.name} references ModKit")
						}
					} else if (entry.name == langPath) {
						langBytes[jarName] = zip.getInputStream(entry).bytes
					}
				}
			}
			return [(jarName): names]
		}

		// No jar may carry another's package tree. The compiler enforces this for the source sets;
		// this is the same statement about the artifact
		contentModules.each { m ->
			var foreign = entries[m].findAll { it.endsWith('.class') && !it.startsWith("forestry/${contentPackages[m]}/") }
			if (!foreign.isEmpty()) {
				problems.add("forestry${m} carries ${foreign.size()} class(es) it does not own, first: ${foreign.first()}")
			}
		}
		var contentInCore = entries['core'].findAll { name ->
			name.endsWith('.class') && contentModules.any { name.startsWith("forestry/${contentPackages[it]}/") }
		}
		if (!contentInCore.isEmpty()) {
			problems.add("the base jar carries ${contentInCore.size()} content class(es), first: ${contentInCore.first()}")
		}

		// The game reads a .mcmeta from the pack that supplied the file it annotates, so one that ships
		// in another jar is silently ignored. An animated texture then renders as the whole frame strip
		var jarOf = new HashMap<String, String>()
		entries.each { jar, names -> names.each { jarOf[it] = jar } }
		entries.each { jar, names ->
			names.findAll { it.endsWith('.mcmeta') }.each { name ->
				var principal = name.substring(0, name.length() - '.mcmeta'.length())
				var owner = jarOf[principal]
				if (owner != null && owner != jar) {
					problems.add("${jar} ships ${name} but ${principal} ships in ${owner}")
				}
			}
		}

		// English is not partitioned: base holds every key, content ids included, the same as the ten
		// hand-written locales beside it. So base must ship en_us and a content jar must not, and a
		// content jar that starts shipping one again has quietly split the file a translator reads.
		//
		// A boot config cannot prove either half: it never renders a lang key, so a headless server
		// reaches Done whether en_us shipped or not. Core once shipped none, because the merge that
		// produces its copy silently no-sourced and the exclude then dropped every remaining candidate;
		// see the note above processResources. A core copy identical to the hand-written file is the
		// same failure under another name, the merge did not run and the generated half never got in
		var handWritten = project.file('src/main/resources/assets/forestry/lang/en_us.json').bytes
		var coreLang = langBytes['core']
		if (coreLang == null) {
			problems.add("core jar: missing ${langPath}")
		} else if (java.util.Arrays.equals(coreLang, handWritten)) {
			problems.add("core jar: ${langPath} is byte-identical to the hand-written file, the merge did not run")
		}
		contentModules.each { m ->
			if (langBytes[m] != null) {
				problems.add("forestry${m} ships ${langPath}; English belongs in the base jar alone")
			}
		}

		if (!problems.isEmpty()) {
			throw new GradleException("Jar partition is wrong:\n  " + problems.join('\n  '))
		}
		logger.lifecycle("checkJarPartition: ${jarFiles.size()} jars, no foreign classes, no ModKit, every .mcmeta with its file, en_us in the base jar alone")
	}
}

tasks.named('check') {
	dependsOn checkJarPartition
}

tasks.named('assemble') {
	contentModules.each { dependsOn contentJars[it] }
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs << '-Xmaxerrs' << '400'
}

idea {
	module {
		downloadSources = true
		downloadJavadoc = true
	}
}

javadoc {
	source = sourceSets.main.allJava
	classpath = sourceSets.main.compileClasspath + sourceSets.main.output

	options.addStringOption('Xdoclint:none', '-quiet')
	options.encoding = 'UTF-8'

	include 'forestry/api/**'
}

tasks.register('javadocJar', Jar) {
	dependsOn javadoc
	archiveClassifier.set('javadoc')
	from javadoc.destinationDir
}

tasks.register('sourcesJar', Jar) {
	archiveClassifier.set('sources')
	from sourceSets.main.allJava

	// The data providers moved into main when datagen lost its own source set, so allJava carries
	// them now. This jar has no classes and cannot reproduce the boot failure the binary excludes
	// prevent, but a provider names ModKit, which is on no classpath a consumer of this jar has, so
	// it is source that cannot compile where it lands. Same rule as the binary jars
	excludeDatagen(delegate)
}

tasks.register('apiJar', Jar) {
	archiveClassifier.set('api')
	// api jar ist just a development aid and serves as both a binary and source jar simultaneously
	from sourceSets.main.output
	from sourceSets.main.allJava

	include 'forestry/api/**'
}

tasks.named('assemble') {
	dependsOn javadocJar
	dependsOn sourcesJar
	dependsOn apiJar
}

publishing {
	afterEvaluate {
		publications {
			mavenJava(MavenPublication) {
				groupId = project.group
				artifactId = project.base.archivesName.get()
				version = project.version

				// ForgeGradle will generate wild dependency definitions, see https://github.com/MinecraftForge/ForgeGradle/issues/584
				// Since we don't actually depend on anything, just remove the entire node.
				pom.withXml {
					asNode().remove(asNode().dependencies)
				}

				from components.java
				artifact sourcesJar
				artifact javadocJar
				artifact apiJar
			}
		}
	}

	repositories {
		maven {
			def releasesRepoUrl = uri(layout.buildDirectory.dir('repos/releases'))
			def snapshotsRepoUrl = uri(layout.buildDirectory.dir('repos/snapshots'))

			name = 'Project'
			url = version.toString().endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl
		}

		maven {
			credentials {
				username = System.getenv('MODMAVEN_USER')
				password = System.getenv('MODMAVEN_PASSWORD')
			}

			name = 'Modmaven'
			url = 'https://modmaven.dev/artifactory/local-releases/'
		}
	}
}

if (System.getenv('CURSEFORGE_TOKEN')) {
	curseforge {
		apiKey = System.getenv('CURSEFORGE_TOKEN')

		project {
			id = project.curseforgeId
			changelogType = 'markdown'
			changelog = getChangelog(version)

			releaseType = 'release'

			addGameVersion(project.minecraftVersion)
			addGameVersion('Forge')
			addGameVersion('Java 17')

			mainArtifact(jar.archiveFile) {
				displayName = "Forestry: Community Edition ${project.version}"
				relations {
					optionalDependency 'jei'
					requiredDependency 'patchouli'
				}
			}
		}
	}
}

modrinth {
	token = System.getenv('MODRINTH_TOKEN')
	projectId = project.modrinthId
	versionName = "Forestry: Community Edition $version"
	versionNumber = version.toString()
	versionType = 'release'
	gameVersions = [minecraftVersion]
	loaders = ['forge']
	changelog = getChangelog(project.version)

	uploadFile = jar
	additionalFiles.add(sourcesJar)
	additionalFiles.add(apiJar)
	additionalFiles.add(javadocJar)

	dependencies {
		optional.project('jei')
		required.project('patchouli')
	}
}

static def getChangelog(Object version) {
	version = version.toString()

	def file = new File('changelog.md')
	if (!file.exists()) {
		return 'Changelog file not found'
	}

	// Relies on the changelog block being "##blahblahblah_VERSION" where _ is a space
	def content = file.text.normalize().split("##.* ")

	for (final def chunk in content) {
		if (chunk.isEmpty()) continue

		def lineTerminatorIndex = chunk.findIndexOf { c -> c == '\n' || c == '\r' }
		def versionString = chunk.substring(0, lineTerminatorIndex)

		if (versionString == version) {
			return "## Forestry $version\n" + chunk.substring(lineTerminatorIndex + 1)
		}
	}

	// Fallback in case this fails
	return "Forestry Update ${version}"
}
